name: Historical replay - Bot JR only
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: ESPN event ID
        required: true
        default: '401874954'
permissions:
  contents: read
concurrency:
  group: historical-replay-bot-jr
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Replay real ESPN match to Bot JR
        env:
          REPLAY_EVENT: ${{ inputs.event_id }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_BOT }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
          TELEGRAM_AUTO_DELETE_SECONDS: '0'
          GOAL_GRAPHICS_ENABLED: 'true'
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
        run: python -u replay_match.py --event "$REPLAY_EVENT"
      - name: Preserve rendered images and delivery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-jr-replay-${{ inputs.event_id }}
          path: replay_output/
          retention-days: 7
