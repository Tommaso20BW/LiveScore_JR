name: Apply GOAL ANNULLATO non-blocking

on:
  push:
    paths:
      - '.github/workflows/apply_goal_cancel_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-goal-cancel-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Crea patcher
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply_goal_cancel_patch.py
          python -m py_compile /tmp/apply_goal_cancel_patch.py

      - name: Applica patch non bloccante
        run: python /tmp/apply_goal_cancel_patch.py

      - name: Verifica sintassi bot
        run: python -m py_compile juve_bot_espn.py

      - name: Installa dipendenze test
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui tutti i test
        run: python -m unittest discover -s tests -v

      - name: Commit e rimuovi workflow temporaneo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add juve_bot_espn.py
          git rm .github/workflows/apply_goal_cancel_patch.yml

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi

          git commit -m "Make cancelled-goal confirmation non-blocking"
          git push origin HEAD:main
