name: LiveScore Rich Demo - faithful beauty

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Durata demo in secondi'
        required: true
        default: '300'
        type: string

permissions:
  contents: read

concurrency:
  group: livescore-rich-demo-faithful-beauty
  cancel-in-progress: true

jobs:
  demo:
    name: Demo Rich fedele ma più bella
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pillow
          playwright install --with-deps chromium

      - name: Verifica sintassi demo
        run: python -m py_compile livescore_rich_demo_faithful.py

      - name: Avvia demo LiveScore Rich
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
        run: >-
          python -u livescore_rich_demo_faithful.py
          --duration "${{ inputs.duration_seconds }}"
