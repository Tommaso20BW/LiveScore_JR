name: LiveScore Rich Demo Original Structure

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Durata demo in secondi'
        required: true
        default: '300'
        type: string
      tick_seconds:
        description: 'Aggiornamento Match Center ogni N secondi'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: livescore-rich-demo-original-structure
  cancel-in-progress: true

jobs:
  demo:
    name: Demo Rich stile bot originale su Bot JR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Aggiorna loghi locali per le grafiche
        continue-on-error: true
        run: python -u fclogo_sync.py --output-dir assets/goal_graphics/team_logos/fclogo_cache

      - name: Verifica sintassi demo
        run: python -m py_compile livescore_rich_demo_original_structure.py

      - name: Avvia demo LiveScore Rich
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
        run: >-
          python -u livescore_rich_demo_original_structure.py
          --duration "${{ inputs.duration_seconds }}"
          --tick "${{ inputs.tick_seconds }}"
