name: Stats Preview - Bot JR

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "ESPN game ID"
        required: true
        type: string
      league_slug:
        description: "ESPN league slug"
        required: true
        default: "ita.1"
        type: string
      momento:
        description: "Tipo di grafica stats"
        required: true
        default: "FT"
        type: choice
        options:
          - HT
          - 2H_END
          - FT

permissions:
  contents: read

jobs:
  send-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Generate and send stats preview
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
        run: >-
          python -u stats_preview.py
          --event-id "${{ inputs.event_id }}"
          --league-slug "${{ inputs.league_slug }}"
          --momento "${{ inputs.momento }}"
