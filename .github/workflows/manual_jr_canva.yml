name: Manual JR Graphic from Canva

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Grafica da creare"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - half
          - end_of_90

      home_name:
        description: "Squadra casa"
        required: true
        default: "Sassuolo"

      away_name:
        description: "Squadra trasferta"
        required: true
        default: "Juventus"

      home_id:
        description: "ESPN team ID casa"
        required: true
        default: "3997"

      away_id:
        description: "ESPN team ID trasferta"
        required: true
        default: "111"

      home_goals:
        description: "Gol casa"
        required: true
        default: "3"

      away_goals:
        description: "Gol trasferta"
        required: true
        default: "2"

      kit:
        description: "Tema grafico Juventus"
        required: true
        default: "away"
        type: choice
        options:
          - home
          - away
          - third

      competition:
        description: "Competizione"
        required: true
        default: "Serie A"

      send_to_bot_jr:
        description: "Invia anche a Bot JR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-jr-canva-graphic
  cancel-in-progress: false

jobs:
  render:
    name: Crea grafica JR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt

      - name: Render from Canva and send to Bot JR
        env:
          # Stessi secrets già usati dal LiveScore JR
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}

          # Serve al codice esistente per salvare un eventuale refresh token
          # ruotato da Canva dentro ai GitHub Secrets.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # Forziamo il destinatario sul canale Bot JR.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_BOT }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
          TELEGRAM_AUTO_DELETE_SECONDS: "0"

          PHASE_KIND: ${{ inputs.phase }}
          HOME_NAME: ${{ inputs.home_name }}
          AWAY_NAME: ${{ inputs.away_name }}
          HOME_ID: ${{ inputs.home_id }}
          AWAY_ID: ${{ inputs.away_id }}
          HOME_GOALS: ${{ inputs.home_goals }}
          AWAY_GOALS: ${{ inputs.away_goals }}
          KIT: ${{ inputs.kit }}
          COMPETITION: ${{ inputs.competition }}
          SEND_TO_BOT_JR: ${{ inputs.send_to_bot_jr }}

        run: python -u manual_phase_graphic.py

      - name: Upload generated PNG
        uses: actions/upload-artifact@v4
        with:
          name: jr-manual-graphic
          path: manual_output/*.png
          if-no-files-found: error
          retention-days: 7
