name: Telegram Bot JR - Auto-delete

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-bot-jr-auto-delete
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install requests==2.34.2

      - name: Delete Bot JR messages after 20 minutes
        env:
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
          GH_PAT:          ${{ secrets.GH_PAT }}
          GIST_ID:         ${{ secrets.GIST_ID }}
        run: |
          echo "Attendo 20 minuti dalla fine della partita..."
          sleep 1200
          python -u telegram_autodelete.py

      - name: Clean previous workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/telegram_bot_autodelete.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id' |
          while read -r RUN_ID; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
