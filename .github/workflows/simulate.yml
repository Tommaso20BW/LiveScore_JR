name: Simulazione partita

# Partita finita        -> replay accelerato (pochi minuti reali).
# Partita in corso/oggi -> live vero: il bot segue ESPN in tempo reale fino al fischio finale.
# In entrambi i casi i messaggi vanno solo su Bot JR e a fine partita vengono cancellati.

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'ID ESPN della partita (es. 401915547)'
        required: true
        type: string
      dry_run:
        description: 'Solo prova: nessun messaggio su Bot JR, solo report'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write     # per cancellare i run vecchi della simulazione

jobs:
  mode:
    name: Stato della partita
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Replay o live?
        id: check
        shell: bash
        env:
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          ID="$(echo "$EVENT_ID" | tr -d '[:space:]')"
          STATE="$(curl -fsS --retry 3 "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=$ID" \
            | jq -r '.header.competitions[0].status.type.state // empty')" || true
          case "$STATE" in
            post)   MODE=replay ;;
            pre|in) MODE=live ;;
            *)      echo "::error::Partita $ID non trovata su ESPN"; exit 1 ;;
          esac
          echo "Stato ESPN: $STATE -> modalita' $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  simulate:
    name: Simulazione (${{ needs.mode.outputs.mode }})
    needs: mode
    runs-on: ubuntu-latest
    # Il live dura quanto la partita vera (supplementari, rigori e post partita compresi).
    timeout-minutes: 300

    # Replay: stesso gruppo del Live Score, aspetta che il live finisca (usa Canva,
    # e il token Canva ruota: due processi insieme si invaliderebbero a vicenda).
    # Live: Canva spento, quindi puo' girare insieme al Live Score vero.
    concurrency:
      group: ${{ needs.mode.outputs.mode == 'live' && 'simulazione-live' || 'juve-live-bot' }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout asset privati (foto, font, loghi)
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_Assets_JR
          token: ${{ secrets.ASSETS_PAT }}
          path: _private_assets

      - name: Installa asset privati
        shell: bash
        run: |
          mkdir -p assets/goal_graphics
          cp -a _private_assets/players _private_assets/fonts _private_assets/team_logos _private_assets/overlays _private_assets/portrait _private_assets/word_textures assets/goal_graphics

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Simula la partita
        env:
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          # Solo il canale di test: la simulazione non scrive mai su Juventus Reborn.
          TELEGRAM_TO_BOT:      ${{ secrets.TELEGRAM_TO_BOT }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          CANVA_CLIENT_ID:      ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET:  ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN:  ${{ secrets.CANVA_REFRESH_TOKEN }}
          EVENT_ID:             ${{ inputs.event_id }}
          SIM_DRY_RUN:          ${{ inputs.dry_run }}
          SIM_MODE:             ${{ needs.mode.outputs.mode }}
        shell: bash
        run: |
          ARGS=("$(echo "$EVENT_ID" | tr -d '[:space:]')" --mode "$SIM_MODE")
          [ "$SIM_DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$SIM_MODE" = "live" ] && ARGS+=(--no-canva)
          python -u -m livescore simulate "${ARGS[@]}" --output sim_output

      - name: Cancella i messaggi rimasti
        # Anche se il run viene annullato o fallisce: niente messaggi lasciati su Bot JR.
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python -u -m livescore simulate-cleanup --output sim_output

      - name: Report e immagini
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulazione-${{ inputs.event_id }}
          path: sim_output/
          if-no-files-found: ignore
          retention-days: 7

  cleanup:
    name: Pulisci la cronologia dei run
    needs: [mode, simulate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pulisci la cronologia dei run
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"   # 0 = cancella TUTTI i run precedenti; resta visibile solo quello in corso
                      # (un run non puo' cancellare se' stesso mentre gira: limite di GitHub)
        run: |
          # Cancella i run COMPLETATI di questo stesso workflow,
          # tenendo solo gli ultimi $KEEP.
          gh api "repos/${{ github.repository }}/actions/workflows/simulate.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
          echo "Pulizia completata."
