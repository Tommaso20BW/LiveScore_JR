name: Juventus Live Score - ESPN

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: 'Team ID ESPN (Juventus: 111)'
        required: false
        default: '111'
      channel:
        description: 'Canale Telegram'
        required: true
        default: 'Juventus Reborn'
        type: choice
        options:
          - Juventus Reborn
          - Bot JR
      goal_graphics:
        description: 'Attiva le grafiche GOAL/SAVED'
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: juve-live-bot
  cancel-in-progress: false

jobs:
  live-score:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore seasonal FCLogo team logos
        if: ${{ github.event.inputs.goal_graphics != 'false' }}
        uses: actions/cache@v6
        with:
          # Il manifest arriva da Git, mai da una cache precedente agli alias manuali.
          path: assets/goal_graphics/team_logos/fclogo_cache/*.png
          key: fclogo-pngs-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fclogo-pngs-v2-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Sync seasonal FCLogo team logos
        id: fclogo_sync
        if: ${{ github.event.inputs.goal_graphics != 'false' }}
        continue-on-error: true
        run: python -u fclogo_sync.py --output-dir assets/goal_graphics/team_logos/fclogo_cache

      - name: Publish seasonal FCLogo team logos
        if: ${{ github.event.inputs.goal_graphics != 'false' && steps.fclogo_sync.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/goal_graphics/team_logos/fclogo_cache
          if git diff --cached --quiet; then
            echo "Nessun logo nuovo da pubblicare"
          else
            git commit -m "Update seasonal FCLogo team logos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Live Score Bot
        env:
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO:          ${{ github.event.inputs.channel == 'Bot JR' && secrets.TELEGRAM_TO_BOT || secrets.TELEGRAM_TO }}
          TELEGRAM_TO_BOT:      ${{ secrets.TELEGRAM_TO_BOT }}
          LIVE_SCORE_CHANNEL_NAME: ${{ github.event.inputs.channel || 'Juventus Reborn' }}
          TELEGRAM_AUTO_DELETE_SECONDS: ${{ github.event.inputs.channel == 'Bot JR' && '1200' || '0' }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          CANVA_CLIENT_ID:      ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET:  ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN:  ${{ secrets.CANVA_REFRESH_TOKEN }}
          TEAM_ID:              ${{ github.event.inputs.team_id || '111' }}
          GOAL_GRAPHICS_ENABLED: ${{ github.event.inputs.goal_graphics || 'true' }}
        run: python -u livescore_runner.py

      - name: Start Bot JR auto-delete after the match
        if: ${{ always() && github.event.inputs.channel == 'Bot JR' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram_bot_autodelete.yml --ref "${{ github.ref_name }}"

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"   # 0 = cancella TUTTI i run precedenti; resta visibile solo quello in corso
                      # (un run non puo' cancellare se' stesso mentre gira: limite di GitHub)
        run: |
          # Cancella i run COMPLETATI di questo stesso workflow,
          # tenendo solo gli ultimi $KEEP.
          gh api "repos/${{ github.repository }}/actions/workflows/main_espn.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
          echo "Pulizia completata."
