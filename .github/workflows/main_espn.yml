name: Live Score

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: 'Squadra'
        required: true
        default: 'Juventus'
        type: choice
        options:
          - 'Juventus'
          - 'Italia'
      custom_team_id:
        description: 'Altra squadra: ID ESPN (se compilato vince sulla scelta sopra)'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: juve-live-bot
  cancel-in-progress: false

jobs:
  live-score:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout asset privati (foto, font, loghi)
        uses: actions/checkout@v6
        with:
          repository: Tommaso20BW/LiveScore_Assets_JR
          token: ${{ secrets.ASSETS_PAT }}
          path: _private_assets

      - name: Installa asset privati
        shell: bash
        run: |
          mkdir -p assets/goal_graphics
          cp -a _private_assets/players _private_assets/fonts _private_assets/team_logos _private_assets/overlays _private_assets/portrait _private_assets/word_textures assets/goal_graphics

      - name: Restore seasonal FCLogo team logos
        uses: actions/cache@v6
        with:
          # Il manifest arriva da Git, mai da una cache precedente agli alias manuali.
          path: assets/goal_graphics/team_logos/**/*.png
          key: fclogo-pngs-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fclogo-pngs-v3-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install chromium

      # Foto di HALF TIME / END OF 90' / FULL TIME: la Mini App raggiunge il bot
      # attraverso un tunnel temporaneo; il modello di scontorno resta in cache.
      - name: Prepara tunnel e scontorno per le foto delle fasi
        shell: bash
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64             -o "${RUNNER_TEMP}/cloudflared"
          chmod +x "${RUNNER_TEMP}/cloudflared"
          echo "CLOUDFLARED=${RUNNER_TEMP}/cloudflared" >> "$GITHUB_ENV"

      - name: Cache modello scontorno
        uses: actions/cache@v6
        with:
          path: ~/.rembg
          key: rembg-isnet-general-use-v1

      - name: Sync seasonal FCLogo team logos
        id: fclogo_sync
        continue-on-error: true
        run: python -u -m livescore sync-logos --output-dir assets/goal_graphics/team_logos

      - name: Publish seasonal FCLogo team logos
        if: ${{ steps.fclogo_sync.outcome == 'success' }}
        # I PNG sono già disponibili nel runner: un push fallito non ferma il live.
        continue-on-error: true
        run: |
          # I loghi vivono nel repo privato degli asset: allinea la copia e fai push li'.
          rm -rf _private_assets/team_logos
          cp -a assets/goal_graphics/team_logos _private_assets/team_logos
          cd _private_assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team_logos
          if git diff --cached --quiet; then
            echo "Nessun logo nuovo da pubblicare"
          else
            git commit -m "Update seasonal FCLogo team logos"
            if ! git push; then
              echo "::warning::Loghi non pubblicati su GitHub; il live prosegue con i file già disponibili nel runner."
              exit 1
            fi
          fi

      - name: Update public FCLogo manifest
        # Solo metadati (nomi e alias dei club, nessuna immagine): serve alla web app di ImageGEN.
        continue-on-error: true
        run: |
          mkdir -p data
          cp assets/goal_graphics/team_logos/manifest.json data/fclogo_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fclogo_manifest.json
          if git diff --cached --quiet; then
            echo "Manifest pubblico già aggiornato"
          else
            git commit -m "Update public FCLogo manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Manifest pubblico non aggiornato."
          fi

      - name: Risolvi la squadra da seguire
        id: team
        shell: bash
        env:
          TEAM_CHOICE: ${{ github.event.inputs.team_id || 'Juventus' }}
          CUSTOM_TEAM_ID: ${{ github.event.inputs.custom_team_id }}
        run: |
          CUSTOM="$(echo "$CUSTOM_TEAM_ID" | tr -d '[:space:]')"
          if [ -n "$CUSTOM" ]; then
            TEAM_ID="$CUSTOM"
          else
            case "$TEAM_CHOICE" in
              Juventus) TEAM_ID=111 ;;
              Italia)   TEAM_ID=162 ;;
              *)        TEAM_ID="${TEAM_CHOICE%% *}" ;;  # vecchio formato "111 - Juventus"
            esac
          fi
          if ! [[ "$TEAM_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::L'ID ESPN deve essere un numero (ricevuto: '$CUSTOM_TEAM_ID')."
            exit 1
          fi
          echo "Squadra seguita: $TEAM_ID"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Run Live Score Bot
        env:
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          # Il live pubblica sempre su Juventus Reborn; per le prove c'e' "Simulazione partita".
          TELEGRAM_TO:          ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TO_BOT:      ${{ secrets.TELEGRAM_TO_BOT }}
          # Chat privata con il bot (come ImageGEN): avvisi per le foto di HT/END/FT.
          PHOTO_CHAT_ID:        ${{ secrets.PHOTO_CHAT_ID }}
          LIVE_SCORE_CHANNEL_NAME: 'Juventus Reborn'
          GH_PAT:               ${{ secrets.GH_PAT }}
          # Token del run usato solo per il branch tecnico runtime-snapshots.
          # Il workflow ha già contents: write.
          SNAPSHOT_GH_TOKEN:    ${{ github.token }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          TEAM_ID:              ${{ steps.team.outputs.team_id }}
          # Le grafiche sono sempre attive; il codice le genera solo per gol/parate della Juve
          # e mai per le amichevoli.
          GOAL_GRAPHICS_ENABLED: 'true'
          # Checkpoint di stato ogni 5 minuti; eventi, cambi di fase ed errori restano immediati.
          LIVE_LOG_HEARTBEAT_MINUTES: '5'
          # Salta solo una sincronizzazione già riuscita; in caso di errore il bot ritenta.
          FCLOGO_SYNC_DONE: ${{ steps.fclogo_sync.outcome == 'success' && 'true' || 'false' }}
        run: python -u -m livescore run

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"   # 0 = cancella TUTTI i run precedenti; resta visibile solo quello in corso
                      # (un run non puo' cancellare se' stesso mentre gira: limite di GitHub)
        run: |
          # Cancella i run COMPLETATI di questo stesso workflow,
          # tenendo solo gli ultimi $KEEP.
          gh api "repos/${{ github.repository }}/actions/workflows/main_espn.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
          echo "Pulizia completata."
