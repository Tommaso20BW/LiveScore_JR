name: FT Logo Padding Test

on:
  workflow_dispatch:

concurrency:
  group: ft-logo-padding-test
  cancel-in-progress: false

jobs:
  compare-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt

      - name: Generate seven FT variants and send to Bot JR
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
        run: python -u ft_compare_botjr.py
