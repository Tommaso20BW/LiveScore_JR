name: Match Scheduler

# Nessun trigger schedule: il cron di GitHub può avere ritardi.
# Il workflow viene avviato tramite cron-job.org ogni 30 minuti.
on:
  workflow_dispatch:

concurrency:
  group: match-scheduler
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installa dipendenze scheduler
        run: |
          python -m pip install requests

      - name: Controlla se c'e' una partita della Juve in arrivo
        id: check
        run: python -u scheduler_check.py

      - name: Verifica che il bot non sia gia' in esecuzione
        id: running
        if: steps.check.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/main_espn.yml/runs?status=in_progress" \
            --jq '.total_count')

          QUEUED=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/main_espn.yml/runs?status=queued" \
            --jq '.total_count')

          TOTAL=$((ACTIVE + QUEUED))

          echo "Run attivi o in coda: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "already_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancia il bot LiveScore
        if: >
          steps.check.outputs.dispatch == 'true' &&
          steps.running.outputs.already_running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatch per: ${{ steps.check.outputs.match_name }}"
          echo "Kickoff: ${{ steps.check.outputs.kickoff }}"
          echo "Competizione: ${{ steps.check.outputs.league }}"

          gh workflow run main_espn.yml \
            --repo "${{ github.repository }}"

      - name: Bot gia' in esecuzione
        if: >
          steps.check.outputs.dispatch == 'true' &&
          steps.running.outputs.already_running == 'true'
        run: |
          echo "Il bot LiveScore e' gia' attivo o in coda."
          echo "Nessun nuovo avvio necessario."

      - name: Nessuna partita da avviare
        if: steps.check.outputs.dispatch == 'false'
        run: |
          echo "Nessuna partita della Juventus nella finestra di avvio."

      - name: Pulisci la cronologia dei run dello scheduler
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        run: |
          gh api \
            "repos/${{ github.repository }}/actions/workflows/scheduler.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Elimino run $RUN_ID"

              gh api -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
            fi
          done

          echo "Pulizia completata."
