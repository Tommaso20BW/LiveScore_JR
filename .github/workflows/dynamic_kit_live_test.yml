name: TEST - Dynamic Juventus Kit 10m

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Durata test interattivo"
        required: true
        default: "600"
      fallback_kit:
        description: "Kit fallback iniziale"
        required: true
        default: "away"
        type: choice
        options:
          - home
          - away
          - third

permissions:
  contents: read

# Impedisce due simulatori contemporanei sullo stesso Telegram bot.
concurrency:
  group: dynamic-kit-live-test
  cancel-in-progress: true

jobs:
  dynamic-kit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Unit tests dynamic kit
        run: python -m unittest -v tests.test_dynamic_kit_live_test

      - name: Run interactive 10 minute simulation
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
          KIT_TEST_DURATION_SECONDS: ${{ inputs.duration_seconds }}
          KIT_TEST_FALLBACK: ${{ inputs.fallback_kit }}
          # Timeline ESPN simulata:
          # t=0   uniform assente -> fallback
          # t=60  ESPN pubblica Third
          # t=180 ESPN corregge in Home
          KIT_TEST_ESPN_TIMELINE: >-
            [{"at":0,"kit":null},{"at":60,"kit":"third"},{"at":180,"kit":"home"}]
        run: python -u dynamic_kit_live_test.py
