name: ImageGen

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jr-manual-graphics
  cancel-in-progress: false

jobs:
  generator:
    name: Generatore Telegram - 30 minuti
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Ripristina loghi FCLogo
        uses: actions/cache@v6
        with:
          path: assets/goal_graphics/team_logos/fclogo_cache/*.png
          key: fclogo-pngs-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fclogo-pngs-v2-${{ runner.os }}-

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installa dipendenze
        run: |
          python -m pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ricevi richieste dalla Mini App Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
          MANUAL_GRAPHICS_OWNER_ID: ${{ secrets.MANUAL_GRAPHICS_OWNER_ID }}
          MANUAL_GRAPHICS_WEBAPP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manual_graphics/webapp/
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          GIST_ID: ${{ secrets.GIST_ID }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
        run: python -u -m manual_graphics.service

      - name: Cancella solo i vecchi run conclusi del generatore
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u -m manual_graphics.lifecycle
