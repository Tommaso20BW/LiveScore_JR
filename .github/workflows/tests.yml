name: Bot Check

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tests-livescore-jr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Controllo completo bot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Evita test inutili mentre stai facendo più modifiche ravvicinate.
      # Se arriva un altro push su main, questo run viene cancellato
      # automaticamente da concurrency.
      - name: Attendi modifiche ravvicinate
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "⏳ Attendo 60 secondi per eventuali altri aggiornamenti..."
          sleep 60
          echo "✅ Repository stabile, avvio i controlli"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        shell: bash
        run: |
          echo "::group::Dipendenze Python"
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          echo "::endgroup::"
          echo "✅ Dipendenze installate"

      - name: Controlla sintassi
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          echo "::group::Controllo sintassi Python"

          if python -m compileall -q . > syntax.log 2>&1; then
            echo "✅ Sintassi OK"
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Errore di sintassi"
            cat syntax.log
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::endgroup::"

      - name: Esegui test
        id: unittest
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          echo "::group::Test automatici"

          if {
            python -m unittest discover -s tests -q &&
            python -m unittest discover -s manual_graphics/tests -q
          } > tests.log 2>&1; then

            echo "✅ Tutti i test superati"
            echo "result=success" >> "$GITHUB_OUTPUT"

          else

            echo "❌ Uno o più test sono falliti"
            echo
            tail -n 80 tests.log

            echo "result=failure" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"
            exit 1
          fi

          echo "::endgroup::"

      - name: Crea riepilogo GitHub
        if: always() && !cancelled()
        shell: bash
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TEST_OUTCOME: ${{ steps.unittest.outcome }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "# LiveScore JR · Bot Check"
            echo
            echo "| Controllo | Stato |"
            echo "|---|---|"

            if [ "$SYNTAX_OUTCOME" = "success" ]; then
              echo "| Sintassi Python | ✅ OK |"
            else
              echo "| Sintassi Python | ❌ Fallita |"
            fi

            if [ "$SYNTAX_OUTCOME" != "success" ]; then
              echo "| Test automatici | ⏭️ Non eseguiti |"
            elif [ "$TEST_OUTCOME" = "success" ]; then
              echo "| Test automatici | ✅ OK |"
            else
              echo "| Test automatici | ❌ Falliti |"
            fi

            echo
            echo "**Branch:** \`$BRANCH\`  "
            echo "**Commit:** \`${SHA:0:7}\`  "
            echo "**Autore:** $ACTOR"

            if [ "$SYNTAX_OUTCOME" != "success" ]; then
              echo
              echo "## Errore principale"
              echo
              echo '```text'
              tail -n 50 syntax.log 2>/dev/null || true
              echo '```'

            elif [ "$TEST_OUTCOME" != "success" ]; then
              echo
              echo "## Errore principale"
              echo
              echo '```text'
              tail -n 80 tests.log 2>/dev/null || true
              echo '```'
            fi

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepara riepilogo errore per Telegram
        if: >-
          always() &&
          !cancelled() &&
          (
            steps.syntax.outcome != 'success' ||
            steps.unittest.outcome != 'success'
          )
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TEST_OUTCOME: ${{ steps.unittest.outcome }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          syntax_failed = os.environ.get("SYNTAX_OUTCOME") != "success"

          if syntax_failed:
              title = "Errore di sintassi Python"
              source = Path("syntax.log")
          else:
              title = "Test automatici falliti"
              source = Path("tests.log")

          text = (
              source.read_text(
                  encoding="utf-8",
                  errors="replace",
              )
              if source.exists()
              else "Log non disponibile."
          )

          text = re.sub(
              r"\x1b\[[0-9;]*m",
              "",
              text,
          )

          text = re.sub(
              r"\b\d{6,12}:[A-Za-z0-9_-]{20,}\b",
              "[TELEGRAM_TOKEN_OSCURATO]",
              text,
          )

          text = re.sub(
              r"\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b",
              "[GITHUB_TOKEN_OSCURATO]",
              text,
          )

          lines = [
              line.rstrip()
              for line in text.splitlines()
              if line.strip()
          ]

          if syntax_failed:
              excerpt_lines = lines[-30:]
          else:
              start = None

              for i, line in enumerate(lines):
                  if (
                      line.startswith("FAIL: ")
                      or line.startswith("ERROR: ")
                  ):
                      start = max(0, i - 1)

              if start is not None:
                  excerpt_lines = lines[start:start + 35]
              else:
                  excerpt_lines = lines[-35:]

          excerpt = (
              "\n".join(excerpt_lines).strip()
              or "Nessun dettaglio disponibile."
          )

          excerpt = excerpt[-2400:]

          repo = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]

          run_url = (
              f"https://github.com/{repo}/actions/runs/"
              f"{os.environ['RUN_ID']}"
          )

          message = (
              "🚨 <b>LIVE SCORE JR · CONTROLLO FALLITO</b>\n\n"
              f"<b>Problema:</b> {html.escape(title)}\n"
              f"<b>Branch:</b> "
              f"<code>{html.escape(os.environ['BRANCH'])}</code>\n"
              f"<b>Commit:</b> "
              f"<code>{html.escape(sha[:7])}</code>\n"
              f"<b>Autore:</b> "
              f"{html.escape(os.environ['ACTOR'])}\n\n"
              "<b>Dettaglio:</b>\n"
              f"<pre>{html.escape(excerpt)}</pre>\n\n"
              f'<a href="{html.escape(run_url)}">'
              "Apri il log completo su GitHub Actions"
              "</a>"
          )

          Path("telegram_message.txt").write_text(
              message,
              encoding="utf-8",
          )
          PY

      - name: Avvisa Bot JR su Telegram
        if: >-
          always() &&
          !cancelled() &&
          (
            steps.syntax.outcome != 'success' ||
            steps.unittest.outcome != 'success'
          )
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_TO_BOT" ]; then
            echo "::warning::TELEGRAM_TOKEN o TELEGRAM_TO_BOT non configurato."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO_BOT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@telegram_message.txt"

      - name: Salva log completi se qualcosa fallisce
        if: >-
          always() &&
          !cancelled() &&
          (
            steps.syntax.outcome != 'success' ||
            steps.unittest.outcome != 'success'
          )
        uses: actions/upload-artifact@v4
        with:
          name: test-error-${{ github.run_id }}
          path: |
            syntax.log
            tests.log
            telegram_message.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Segna il workflow come fallito
        if: >-
          always() &&
          !cancelled() &&
          (
            steps.syntax.outcome != 'success' ||
            steps.unittest.outcome != 'success'
          )
        run: |
          echo "❌ Uno o più controlli del bot sono falliti."
          exit 1

      - name: Pulisci la cronologia dei test
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        shell: bash
        run: |
          echo "::group::Pulizia cronologia"

          gh api \
            "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?status=completed&per_page=100" \
            --jq \
            '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              gh api \
                -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                >/dev/null 2>&1 || true
            fi
          done

          echo "✅ Pulizia completata"
          echo "::endgroup::"
