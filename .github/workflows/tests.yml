name: Bot Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tests-livescore-jr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Controllo completo bot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Controlla sintassi di tutti i file Python
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q . 2>&1 | tee syntax.log

      - name: Esegui tutti i test
        id: unittest
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log

      - name: Prepara riepilogo errore per Telegram
        if: always() && (steps.syntax.outcome != 'success' || steps.unittest.outcome != 'success')
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TEST_OUTCOME: ${{ steps.unittest.outcome }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          syntax_failed = os.environ.get("SYNTAX_OUTCOME") != "success"

          if syntax_failed:
              title = "Errore di sintassi Python"
              source = Path("syntax.log")
          else:
              title = "Test automatici falliti"
              source = Path("tests.log")

          text = source.read_text(encoding="utf-8", errors="replace") if source.exists() else "Log non disponibile."

          # Rimuove sequenze ANSI e oscura eventuali token che finissero per errore nel log.
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          text = re.sub(r"\b\d{6,12}:[A-Za-z0-9_-]{20,}\b", "[TELEGRAM_TOKEN_OSCURATO]", text)
          text = re.sub(r"\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b", "[GITHUB_TOKEN_OSCURATO]", text)

          lines = text.splitlines()

          # Cerca l'ultima sezione utile di unittest, altrimenti usa la coda del log.
          start = None
          for i, line in enumerate(lines):
              if line.startswith("FAIL: ") or line.startswith("ERROR: "):
                  start = max(0, i - 1)

          if start is not None:
              excerpt_lines = lines[start:start + 32]
              # Aggiunge anche il riepilogo finale, se non è già incluso.
              tail = lines[-8:]
              if tail and tail[0] not in excerpt_lines:
                  excerpt_lines += ["", "...", ""] + tail
          else:
              excerpt_lines = lines[-35:]

          excerpt = "\n".join(excerpt_lines).strip()
          if not excerpt:
              excerpt = "Il controllo è fallito senza produrre dettagli nel log."

          # Telegram ha un limite di 4096 caratteri: teniamo il dettaglio compatto.
          excerpt = excerpt[-2400:]

          repo = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['RUN_ID']}"

          message = (
              "🚨 <b>LIVE SCORE JR · CONTROLLO FALLITO</b>\n\n"
              f"<b>Problema:</b> {html.escape(title)}\n"
              f"<b>Branch:</b> <code>{html.escape(os.environ['BRANCH'])}</code>\n"
              f"<b>Commit:</b> <code>{html.escape(sha[:7])}</code>\n"
              f"<b>Autore:</b> {html.escape(os.environ['ACTOR'])}\n\n"
              "<b>Dettaglio principale:</b>\n"
              f"<pre>{html.escape(excerpt)}</pre>\n\n"
              f"<a href=\"{html.escape(run_url)}\">Apri il log completo su GitHub Actions</a>"
          )

          Path("telegram_message.txt").write_text(message, encoding="utf-8")
          PY

      - name: Avvisa Bot JR su Telegram
        if: always() && (steps.syntax.outcome != 'success' || steps.unittest.outcome != 'success')
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_TO_BOT" ]; then
            echo "::warning::TELEGRAM_TOKEN o TELEGRAM_TO_BOT non configurato."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO_BOT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@telegram_message.txt"

      - name: Salva log completi se qualcosa fallisce
        if: always() && (steps.syntax.outcome != 'success' || steps.unittest.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: test-error-${{ github.run_id }}
          path: |
            syntax.log
            tests.log
            telegram_message.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Segna il workflow come fallito
        if: always() && (steps.syntax.outcome != 'success' || steps.unittest.outcome != 'success')
        run: |
          echo "Uno o più controlli del bot sono falliti."
          exit 1

      - name: Pulisci la cronologia dei test
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        shell: bash
        run: |
          gh api \
            "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Elimino run test $RUN_ID"

              gh api -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
            fi
          done

          echo "Pulizia test completata."
