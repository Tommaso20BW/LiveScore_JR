name: Manual JR Goal Graphics

on:
  workflow_dispatch:
    inputs:
      goal_items_json:
        description: 'Player + kit + posa. Puoi usare kit=all e pose=both.'
        required: true
        default: '[{"player":"Kenan Yildiz","kit":"away","pose":"both","minute":"57"}]'
        type: string

      home_name:
        description: "Squadra casa"
        required: true
        default: "Juventus"
        type: string

      away_name:
        description: "Squadra trasferta"
        required: true
        default: "Sassuolo"
        type: string

      home_id:
        description: "ESPN ID squadra casa"
        required: true
        default: "111"
        type: string

      away_id:
        description: "ESPN ID squadra trasferta"
        required: true
        default: "3997"
        type: string

      home_goals:
        description: "Gol casa"
        required: true
        default: "0"
        type: string

      away_goals:
        description: "Gol trasferta"
        required: true
        default: "0"
        type: string

      competition:
        description: "Competizione"
        required: true
        default: "Serie A"
        type: string

      send_to_bot_jr:
        description: "Invia anche a Bot JR"
        required: true
        default: true
        type: boolean

      send_as_album:
        description: "Se sono più immagini, inviale insieme come album"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-jr-goal-graphics
  cancel-in-progress: false

jobs:
  render:
    name: Genera GOAL JR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt

      - name: Render GOAL graphics
        env:
          # Bot JR
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_BOT }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}

          # Manteniamo disponibili anche questi perché juve_bot_espn.py
          # li legge all'import, ma NON vengono usati per creare le pose.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIST_ID: ${{ secrets.GIST_ID }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}

          GOAL_ITEMS_JSON: ${{ inputs.goal_items_json }}
          HOME_NAME: ${{ inputs.home_name }}
          AWAY_NAME: ${{ inputs.away_name }}
          HOME_ID: ${{ inputs.home_id }}
          AWAY_ID: ${{ inputs.away_id }}
          HOME_GOALS: ${{ inputs.home_goals }}
          AWAY_GOALS: ${{ inputs.away_goals }}
          COMPETITION: ${{ inputs.competition }}
          SEND_TO_BOT_JR: ${{ inputs.send_to_bot_jr }}
          SEND_AS_ALBUM: ${{ inputs.send_as_album }}

        run: python -u manual_goal_graphics.py

      - name: Upload PNG
        uses: actions/upload-artifact@v4
        with:
          name: jr-manual-goal-graphics
          path: manual_goal_output/*.png
          if-no-files-found: error
          retention-days: 7
