name: TEST - REAL Dynamic Kit 401874750 5m

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-dynamic-kit-401874750
  cancel-in-progress: false

jobs:
  real-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore seasonal FCLogo team logos
        uses: actions/cache@v6
        with:
          path: assets/goal_graphics/team_logos/fclogo_cache/*.png
          key: fclogo-real-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fclogo-pngs-v2-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Sync seasonal FCLogo team logos
        id: fclogo_sync
        continue-on-error: true
        run: |
          python -u fclogo_sync.py \
            --output-dir assets/goal_graphics/team_logos/fclogo_cache

      - name: Syntax check
        run: python -m py_compile real_dynamic_kit_401874750_test.py

      - name: Run REAL 5-minute test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_BOT: ${{ secrets.TELEGRAM_TO_BOT }}
          # Anche le funzioni produzione che leggono CHAT_ID puntano a Bot JR.
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_BOT }}
          LIVE_SCORE_CHANNEL_NAME: Bot JR
          TELEGRAM_AUTO_DELETE_SECONDS: '0'

          TEAM_ID: '111'
          GOAL_GRAPHICS_ENABLED: 'true'

          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}

          # get_valid_token() mantiene lo stesso percorso di refresh Canva
          # del bot reale. GH_PAT resta disponibile per la rotazione secret.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # Il branch tecnico usa il token del workflow, non un nuovo secret.
          SNAPSHOT_GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TEST_KEY: test_401874750_${{ github.run_id }}

          KIT_REAL_TEST_DURATION_SECONDS: '300'
          KIT_REAL_TEST_POLL_SECONDS: '6'

          # Evita una seconda sync interna se quella sopra è riuscita.
          FCLOGO_SYNC_DONE: ${{ steps.fclogo_sync.outcome == 'success' && 'true' || 'false' }}

          # INTENZIONALMENTE nessun GIST_ID:
          # il test non deve leggere/scrivere/resettare lo stato produzione.
        run: python -u real_dynamic_kit_401874750_test.py
