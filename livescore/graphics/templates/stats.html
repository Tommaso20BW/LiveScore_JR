<!doctype html><html lang="it"><meta charset="utf-8"><style>
@font-face{font-family:Dharma;src:url({{FONT}})}
*{box-sizing:border-box}html,body{margin:0;width:1086px;height:1448px;overflow:hidden}
body{background:url({{BACKGROUND}}) center/cover;color:white;font-family:Arial}
main{position:absolute;inset:76px}
header{position:absolute;left:36px;right:36px;top:55px;height:166px;display:grid;grid-template-columns:135px 1fr 135px;align-items:center;justify-items:center;gap:10px}
.logo{height:88px;width:auto;max-width:93px;object-fit:contain}.title{width:560px;height:auto}
.phase{position:absolute;top:235px;left:50%;transform:translateX(-50%);width:255px;height:40px;object-fit:contain;filter:drop-shadow(0 4px 6px #0008)}
.stats{position:absolute;left:38px;right:38px;top:310px;bottom:60px;display:flex;flex-direction:column}
.row{flex:1;display:grid;grid-template-columns:115px 1fr 115px;gap:24px;align-items:center;border-top:1px solid #ffffff26}
.row:last-child{border-bottom:1px solid #ffffff26}span{font:62px/1 Dharma;text-align:center}
.home{color:{{LEFT}}}.away{color:{{RIGHT}}}
.label{font-size:18px;letter-spacing:4px;text-align:center;margin-bottom:17px}
.track{display:flex;height:10px;gap:6px}.track i{background:{{LEFT}}}.track b{background:{{RIGHT}}}
.track.empty{height:10px;background:#39434d}
footer{position:absolute;top:1260px;left:0;right:0;text-align:center;font:12px/16px Arial;letter-spacing:1.8px;color:#a5adb3}
img{filter:drop-shadow(0 5px 8px #0007)}
</style><body><main><header><img class="logo" src="{{HOME_LOGO}}"><img class="title" src="{{TITLE}}"><img class="logo" src="{{AWAY_LOGO}}"></header><img class="phase" src="{{PHASE}}"><section class="stats">{{ROWS}}</section><footer>JR STATS • {{COMPETITION}}</footer></main></body></html>
