<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f8">
  <title>JR Graphics</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      --bg: #eef1f6;
      --bg-2: #f7f8fb;
      --text: #101114;
      --text-soft: #34373d;
      --muted: #737983;
      --glass: rgba(255,255,255,.56);
      --glass-strong: rgba(255,255,255,.76);
      --glass-input: rgba(255,255,255,.64);
      --stroke: rgba(255,255,255,.72);
      --stroke-soft: rgba(35,39,47,.08);
      --shadow: 0 18px 55px rgba(53,62,81,.12), 0 2px 8px rgba(53,62,81,.06);
      --shadow-soft: 0 10px 30px rgba(53,62,81,.09);
      --gold: #b89237;
      --gold-2: #d7bc6d;
      --gold-soft: rgba(184,146,55,.14);
      --focus: rgba(184,146,55,.30);
      --danger: #b42336;
      --danger-bg: rgba(180,35,54,.09);
      --danger-line: rgba(180,35,54,.18);
      --button-text: #18140a;
      --orb-a: rgba(215,188,109,.28);
      --orb-b: rgba(122,160,235,.18);
      --orb-c: rgba(213,218,228,.48);
      --footer-fade: rgba(238,241,246,.86);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 17px;
    }

    html[data-theme="dark"] {
      --bg: #090a0c;
      --bg-2: #111216;
      --text: #f7f7f8;
      --text-soft: #d7d8dc;
      --muted: #969aa3;
      --glass: rgba(29,31,36,.54);
      --glass-strong: rgba(38,40,46,.72);
      --glass-input: rgba(24,26,31,.66);
      --stroke: rgba(255,255,255,.12);
      --stroke-soft: rgba(255,255,255,.07);
      --shadow: 0 24px 70px rgba(0,0,0,.32), 0 2px 12px rgba(0,0,0,.20);
      --shadow-soft: 0 12px 34px rgba(0,0,0,.24);
      --gold: #d1b45e;
      --gold-2: #f0d88a;
      --gold-soft: rgba(209,180,94,.13);
      --focus: rgba(209,180,94,.28);
      --danger: #ff9aa6;
      --danger-bg: rgba(255,107,125,.10);
      --danger-line: rgba(255,138,151,.19);
      --button-text: #131108;
      --orb-a: rgba(209,180,94,.18);
      --orb-b: rgba(87,118,183,.16);
      --orb-c: rgba(255,255,255,.06);
      --footer-fade: rgba(9,10,12,.84);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding: 18px 16px calc(122px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 12% -6%, var(--orb-a) 0, transparent 31%),
        radial-gradient(circle at 102% 20%, var(--orb-b) 0, transparent 34%),
        radial-gradient(circle at 52% 112%, var(--orb-c) 0, transparent 36%),
        linear-gradient(145deg, var(--bg-2), var(--bg));
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .42;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.65), transparent 72%);
    }

    .wrap { width: min(760px, 100%); margin: 0 auto; position: relative; z-index: 1; }
    .hero { padding: 10px 5px 18px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .20em;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 18px var(--gold); }
    h1 { font-size: clamp(32px, 7vw, 48px); line-height: .98; margin: 0 0 9px; letter-spacing: -.055em; font-weight: 760; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.42; max-width: 520px; }

    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--glass-strong), var(--glass));
      border: 1px solid var(--stroke);
      border-radius: var(--radius-xl);
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(175%);
      -webkit-backdrop-filter: blur(28px) saturate(175%);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg, rgba(255,255,255,.23), transparent 28%, transparent 68%, rgba(255,255,255,.035));
      opacity: .62;
    }
    .card > * { position: relative; z-index: 1; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label {
      display: block;
      margin: 0 0 7px 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .095em;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--stroke-soft);
      background: var(--glass-input);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 560;
      letter-spacing: -.01em;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 3px 10px rgba(0,0,0,.025);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease, background .18s ease;
      appearance: auto;
    }
    input::placeholder { color: var(--muted); opacity: .74; }
    input:focus, select:focus {
      border-color: color-mix(in srgb, var(--gold) 56%, transparent);
      box-shadow: 0 0 0 4px var(--focus), inset 0 1px 0 rgba(255,255,255,.11);
      background: var(--glass-strong);
    }

    .score { display: grid; grid-template-columns: 1fr 30px 1fr; align-items: center; gap: 8px; }
    .score input { text-align: center; font-size: 22px; font-weight: 720; }
    .dash { text-align: center; color: var(--muted); font-weight: 650; font-size: 18px; }

    .stats { display: grid; gap: 9px; }
    .stat {
      display: grid;
      grid-template-columns: minmax(118px, 1fr) 82px 82px;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--stroke-soft);
    }
    .stat:last-child { border-bottom: 0; }
    .stat-name { color: var(--text-soft); font-size: 12px; font-weight: 680; letter-spacing: -.005em; }
    .stat input { min-height: 42px; text-align: center; padding: 0 8px; font-size: 13px; }

    .hidden { display: none !important; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 10px; }
    .error {
      display: none;
      border: 1px solid var(--danger-line);
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 13px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .footer {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent 0, var(--footer-fade) 42%, var(--bg) 100%);
      pointer-events: none;
    }
    .footer-inner {
      width: min(760px, 100%);
      margin: auto;
      padding: 7px;
      border: 1px solid var(--stroke);
      border-radius: 23px;
      background: var(--glass);
      box-shadow: 0 18px 45px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.15);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      pointer-events: auto;
    }
    button {
      width: 100%;
      min-height: 55px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 17px;
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: var(--button-text);
      font-weight: 850;
      font-size: 13px;
      letter-spacing: .085em;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 9px 22px rgba(133,101,31,.22);
      transition: transform .15s ease, filter .15s ease, opacity .15s ease;
    }
    button:active { transform: scale(.985); filter: brightness(.97); }
    button:disabled { opacity: .46; cursor: default; box-shadow: none; }

    @media (max-width: 520px) {
      body { padding-left: 12px; padding-right: 12px; }
      .hero { padding-left: 4px; padding-right: 4px; }
      .grid { grid-template-columns: 1fr; gap: 11px; }
      .field.full { grid-column: auto; }
      .card { border-radius: 24px; padding: 14px; }
      .stat { grid-template-columns: 1fr 68px 68px; }
      .footer { padding-left: 12px; padding-right: 12px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: rise .38s ease both; }
      .card:nth-of-type(2) { animation-delay: .035s; }
      .card:nth-of-type(3) { animation-delay: .07s; }
      .card:nth-of-type(4) { animation-delay: .105s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">JUVENTUS REBORN</div>
    <h1>JR Graphics</h1>
    <div class="subtitle">Crea la grafica e inviala direttamente al workflow attivo.</div>
  </header>

  <div id="error" class="error"></div>

  <div class="card grid">
    <div class="field">
      <label for="kind">Grafica</label>
      <select id="kind">
        <option value="goal">GOAL</option>
        <option value="saved">SAVED</option>
        <option value="kick">KICK OFF</option>
        <option value="half">HALF TIME</option>
        <option value="end_of_90">END OF 90'</option>
        <option value="full">FULL TIME</option>
        <option value="stats">STATS</option>
      </select>
    </div>
    <div class="field">
      <label for="competition">Competizione</label>
      <select id="competition">
        <option value="ita.1">Serie A</option>
        <option value="ita.coppa_italia">Coppa Italia</option>
        <option value="ita.super_cup">Supercoppa Italiana</option>
        <option value="uefa.champions">Champions League</option>
        <option value="uefa.europa">Europa League</option>
        <option value="uefa.europa.conf">Conference League</option>
        <option value="uefa.super_cup">Supercoppa UEFA</option>
        <option value="fifa.cwc">Mondiale per Club</option>
      </select>
    </div>
    <div class="field">
      <label for="kit">Kit Juventus</label>
      <select id="kit">
        <option value="home">Home</option>
        <option value="away">Away</option>
        <option value="third">Third</option>
      </select>
    </div>
    <div class="field">
      <label for="side">Juventus</label>
      <select id="side">
        <option value="home">In casa</option>
        <option value="away">In trasferta</option>
      </select>
    </div>
    <div class="field full">
      <label for="opponent">Avversario</label>
      <input id="opponent" list="teams" autocomplete="off" placeholder="Es. Atalanta">
      <datalist id="teams"></datalist>
    </div>
  </div>

  <div id="playerCard" class="card grid">
    <div class="field full">
      <label id="playerLabel" for="player">Giocatore</label>
      <input id="player" list="players" autocomplete="off" placeholder="Es. Kenan Yildiz">
      <datalist id="players"></datalist>
    </div>
    <div class="field">
      <label for="minute">Minuto</label>
      <input id="minute" inputmode="numeric" placeholder="Es. 67 o 90+4">
    </div>
    <div class="field">
      <label for="pose">Posa</label>
      <select id="pose">
        <option value="arms_crossed">Braccia incrociate</option>
        <option value="pointing">Indica</option>
      </select>
    </div>
  </div>

  <div id="scoreCard" class="card">
    <label>Risultato casa - trasferta</label>
    <div class="score">
      <input id="homeScore" type="number" min="0" max="99" inputmode="numeric" placeholder="0">
      <div class="dash">−</div>
      <input id="awayScore" type="number" min="0" max="99" inputmode="numeric" placeholder="0">
    </div>
  </div>

  <div id="shootoutCard" class="card hidden">
    <label>Rigori finali casa - trasferta</label>
    <div class="score">
      <input id="homeShootout" type="number" min="0" max="99" inputmode="numeric" placeholder="">
      <div class="dash">−</div>
      <input id="awayShootout" type="number" min="0" max="99" inputmode="numeric" placeholder="">
    </div>
    <div class="hint">Lascia entrambi vuoti se non ci sono rigori.</div>
  </div>

  <div id="statsCard" class="card hidden">
    <div class="field" style="margin-bottom:14px">
      <label for="moment">Momento</label>
      <select id="moment">
        <option value="HT">HALF TIME</option>
        <option value="2H_END">END OF 90'</option>
        <option value="FT">FULL TIME</option>
      </select>
    </div>
    <div id="stats" class="stats"></div>
    <div class="hint">Lascia una riga completamente vuota per non inserirla.</div>
  </div>
</div>

<div class="footer">
  <div class="footer-inner"><button id="generate">GENERA GRAFICA</button></div>
</div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;

  const metaTheme = document.querySelector('meta[name=\"theme-color\"]');
  const mediaTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function preferredTheme() {
    if (tg && (tg.colorScheme === 'dark' || tg.colorScheme === 'light')) return tg.colorScheme;
    return mediaTheme && mediaTheme.matches ? 'dark' : 'light';
  }

  function applyTheme() {
    const theme = preferredTheme();
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#111214' : '#f2f4f8');
  }

  applyTheme();
  if (mediaTheme) {
    const onSystemTheme = () => {
      if (!tg || !tg.colorScheme) applyTheme();
    };
    if (mediaTheme.addEventListener) mediaTheme.addEventListener('change', onSystemTheme);
    else if (mediaTheme.addListener) mediaTheme.addListener(onSystemTheme);
  }
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.onEvent) tg.onEvent('themeChanged', applyTheme);
  }

  const STATS = ['POSSESSO','xG','TIRI','TIRI IN PORTA','CORNER','FALLI','FUORIGIOCO','AMMONITI','ESPULSI','PARATE','PRECISIONE PASSAGGI','PASSAGGI'];
  let teams = [];
  let players = [];
  const session = new URLSearchParams(location.search).get('session') || '';

  const $ = id => document.getElementById(id);
  const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const repoBase = location.pathname.includes('/manual_graphics/webapp')
    ? location.pathname.split('/manual_graphics/webapp')[0] + '/'
    : '../../';

  function showError(message) {
    $('error').textContent = message;
    $('error').style.display = 'block';
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  function clearError() { $('error').style.display = 'none'; }

  function makeStats() {
    $('stats').innerHTML = STATS.map((label, i) => `
      <div class="stat">
        <div class="stat-name">${label}</div>
        <input id="s${i}h" inputmode="decimal" placeholder="Casa">
        <input id="s${i}a" inputmode="decimal" placeholder="Trasf.">
      </div>`).join('');
  }

  async function loadCatalogs() {
    try {
      const [p, t] = await Promise.all([
        fetch(repoBase + 'goal_players.json', {cache:'no-store'}),
        fetch(repoBase + 'assets/goal_graphics/team_logos/fclogo_cache/manifest.json', {cache:'no-store'})
      ]);
      if (!p.ok || !t.ok) throw new Error('cataloghi');
      players = (await p.json()).players || [];
      teams = ((await t.json()).teams || []).filter(row => !normalize(row.name).includes('juventus'));
      $('teams').innerHTML = teams.map(row => `<option value="${escapeHtml(row.name)}"></option>`).join('');
      refreshPlayers();
    } catch (_) {
      showError('Impossibile caricare giocatori e squadre da GitHub Pages. Controlla che Pages sia attivo sulla root del branch main.');
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function refreshPlayers() {
    const keeper = $('kind').value === 'saved';
    const list = players.filter(row => !keeper || row.role === 'goalkeeper');
    $('players').innerHTML = list.map(row => `<option value="${escapeHtml(row.name)}"></option>`).join('');
    $('playerLabel').textContent = keeper ? 'Portiere' : 'Giocatore';
  }

  function findTeam(value) {
    const q = normalize(value);
    return teams.find(row => normalize(row.name) === q || (row.aliases || []).some(a => normalize(a) === q));
  }
  function findPlayer(value) {
    const q = normalize(value);
    const keeper = $('kind').value === 'saved';
    return players.find(row => (!keeper || row.role === 'goalkeeper') &&
      (normalize(row.name) === q || (row.aliases || []).some(a => normalize(a) === q)));
  }

  function score(homeId, awayId, optional=false) {
    const h = $(homeId).value.trim();
    const a = $(awayId).value.trim();
    if (!h && !a && optional) return null;
    if (h === '' || a === '') throw new Error('Inserisci entrambi i valori del risultato.');
    const result = [Number(h), Number(a)];
    if (!result.every(Number.isInteger) || result.some(v => v < 0 || v > 99)) throw new Error('Risultato non valido.');
    return result;
  }

  function updateVisibility() {
    const kind = $('kind').value;
    $('playerCard').classList.toggle('hidden', !['goal','saved'].includes(kind));
    $('scoreCard').classList.toggle('hidden', !['goal','saved','half','full','end_of_90'].includes(kind));
    $('shootoutCard').classList.toggle('hidden', kind !== 'full');
    $('statsCard').classList.toggle('hidden', kind !== 'stats');
    refreshPlayers();
  }

  function buildPayload() {
    const kind = $('kind').value;
    const team = findTeam($('opponent').value);
    if (!team) throw new Error('Seleziona un avversario presente nell’elenco.');
    const data = {
      kind,
      competition: $('competition').value,
      kit: $('kit').value,
      side: $('side').value,
      opponent: {name: team.name, id: String(team.espn_id || '')}
    };

    if (['goal','saved'].includes(kind)) {
      const player = findPlayer($('player').value);
      if (!player) throw new Error(kind === 'saved' ? 'Seleziona un portiere presente nell’elenco.' : 'Seleziona un giocatore presente nell’elenco.');
      if (!$('minute').value.trim()) throw new Error('Inserisci il minuto.');
      data.player = player.name;
      data.minute = $('minute').value.trim();
      data.pose = $('pose').value;
      data.score = score('homeScore','awayScore');
    } else if (['half','full','end_of_90'].includes(kind)) {
      data.score = score('homeScore','awayScore');
      if (kind === 'full') {
        data.shootout = score('homeShootout','awayShootout', true);
        if (data.shootout && data.shootout[0] === data.shootout[1]) throw new Error('I rigori devono avere un vincitore.');
      }
    } else if (kind === 'stats') {
      data.moment = $('moment').value;
      data.rows = STATS.map((label, i) => ({label, home:$(`s${i}h`).value.trim(), away:$(`s${i}a`).value.trim()}))
        .filter(row => row.home || row.away);
      if (!data.rows.length) throw new Error('Inserisci almeno una statistica.');
      if (data.rows.some(row => !row.home || !row.away)) throw new Error('Per ogni statistica inserisci sia casa sia trasferta.');
    }
    if (!session) throw new Error('Sessione non attiva. Avvia ImageGen e apri la Mini App dal pulsante del bot.');
    return {v:1, action:'render', session, data};
  }

  $('kind').addEventListener('change', updateVisibility);
  $('generate').addEventListener('click', () => {
    clearError();
    if (!tg || typeof tg.sendData !== 'function') {
      showError('Apri questa pagina dal pulsante del bot Telegram mentre il workflow ImageGen è attivo.');
      return;
    }
    try {
      const payload = JSON.stringify(buildPayload());
      if (new TextEncoder().encode(payload).length > 4096) throw new Error('Troppi dati per Telegram. Riduci le statistiche.');
      $('generate').disabled = true;
      $('generate').textContent = 'INVIO…';
      tg.sendData(payload);
    } catch (err) {
      $('generate').disabled = false;
      $('generate').textContent = 'GENERA GRAFICA';
      showError(err.message || 'Dati non validi.');
    }
  });

  makeStats();
  updateVisibility();
  if (!session) {
    $('generate').disabled = true;
    showError('Generatore non attivo. Avvia il workflow ImageGen e apri la Mini App dal pulsante del bot.');
  }
  loadCatalogs();
})();
</script>
</body>
</html>
